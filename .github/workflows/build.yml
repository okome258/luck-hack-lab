name: 毎日のサイト更新

on:
  schedule:
    - cron: "5 15 * * *"   # 毎日 0:05 JST(UTC 15:05)
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 暦のテスト
        run: |
          pip install pytest
          python -m pytest -q
      - name: サイトを生成
        run: python build.py
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "サイト自動更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
